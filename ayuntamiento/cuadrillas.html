<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuadrillas · Cívica</title><link rel="stylesheet" href="../css/app.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/ops-v11.css"></head><body><header class="adminbar"><a class="brand" href="index.html">Cívica · Ayuntamiento</a><nav><a href="index.html">Operaciones</a><a class="active" href="cuadrillas.html">Cuadrillas</a><a href="estadisticas.html">Rendimiento</a><a href="patrones.html">Patrones</a><a href="../cuadrilla.html">Campo ↗</a></nav></header><main class="admin-main"><span class="eyebrow">Recursos</span><h1>Cuadrillas</h1><p class="muted">Carga actual y trabajos asignados. Úsalo para equilibrar la operación.</p><div id="crew-board" class="crew-board-v11"></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="../js/config.js"></script><script src="../js/app.js"></script><script src="../js/backend.js"></script><script src="../js/auth.js"></script><script src="../js/workflow-v13.js"></script><script>CivicaAuth.requireRole(["municipal"])</script><script>Backend.subscribe(xs=>{let open=xs.filter(i=>!["Resuelta","Descartada","Duplicada"].includes(i.status));crew_board.innerHTML=App.crews.map(c=>{let jobs=open.filter(i=>i.crew===c.name).sort((a,b)=>App.priority(b)-App.priority(a));return `<section class="panel crew-board-card"><div class="crew-board-head"><div><span class="status">${jobs.some(i=>i.status==="En curso")?"En trabajo":"Disponible"}</span><h2>${App.esc(c.name)}</h2><p class="muted">${App.esc(c.specialty||"Operaciones")}</p></div><strong>${jobs.length}<small> trabajos</small></strong></div>${jobs.slice(0,4).map(i=>`<a class="mini-job" href="incidencia.html?id=${i.id}"><b>${App.priority(i)}</b><span>${App.esc(i.category)}<small>${App.esc(i.status)}</small></span><i>→</i></a>`).join("")||"<p class='muted'>Sin trabajos asignados.</p>"}</section>`}).join("")})</script></body></html>
